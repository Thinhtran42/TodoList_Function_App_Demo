version: '3.9'

services:
  functionapp1:
    build: ./src/FunctionApp.Producer
    container_name: funcapp1
    ports:
      - "7071:80"
    environment:
      - CosmosDBConnection=AccountEndpoint=https://cosmosdb:8081/;AccountKey=key;
      - ServiceBusConnection=Endpoint=sb://servicebus:5672/;
    depends_on:
      - cosmosdb
      - servicebus

  functionapp2:
    build: ./src/FunctionApp.Consumer
    container_name: funcapp2
    ports:
      - "7072:80"
    deploy:
      replicas: 2   # scale consumer
    environment:
      - CosmosDBConnection=AccountEndpoint=https://cosmosdb:8081/;AccountKey=key;
      - ServiceBusConnection=Endpoint=sb://servicebus:5672/;
    depends_on:
      - cosmosdb
      - servicebus

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    ports:
      - "8081:8081"
      - "1234:1234"

  servicebus:
    image: ghcr.io/azure/azure-service-bus-emulator:latest
    ports:
      - "5672:5672"
